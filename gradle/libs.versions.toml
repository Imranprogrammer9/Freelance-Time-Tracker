[versions]
# Toolchain upgraded for supabase-kt 3.6.0 ecosystem:
#  - AGP 8.9.x: required by androidx.browser 1.10 (pulled by supabase-auth-kt-android 3.6.0)
#  - Kotlin 2.2.0: required by ktor 3.4.x metadata (Kotlin 2.0 stdlib can't read 2.3.0 metadata)
#  - Compose BOM 2025.06.00: Kotlin 2.2 compose-compiler pairing
#  - compileSdk 36: required by androidx.browser 1.10
agp = "8.9.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2025.06.00"
navigationCompose = "2.8.0"
kotlinxSerialization = "1.7.3"
koin = "4.0.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofitSerialization = "1.0.0"
room = "2.7.2"
datastore = "1.1.1"
appcompat = "1.7.0"
coil = "2.7.0"
composeIcons = "1.1.1"
supabase = "3.6.0"
ktor = "3.3.0"
# Firebase BOM 33.1.2 — last version compatible with AGP 8.5.2 / compileSdk 34.
# Newer BOMs (33.5+) drag androidx.activity 1.12.x which requires AGP 8.9.1+ / compileSdk 36.
firebaseBom = "33.1.2"
credentials = "1.3.0"
googleid = "1.1.1"
# RevenueCat — `purchases` only. `purchases-ui` (prebuilt Paywall composable) deliberately
# excluded: kit ships a custom paywall on its own components (hard + soft variants), and
# purchases-ui drags Compose-Multiplatform deps (same conflict class as supabase compose-auth-ui).
revenuecat = "9.23.1"
posthog = "3.44.2"
playReview = "2.0.2"
timber = "5.0.1"
# Google Play Services OSS licenses — generates a Settings → About licenses screen
# from the project's deps at build time. Plugin scans, library renders.
ossLicensesPlugin = "0.10.6"
ossLicenses = "17.1.0"
detekt = "1.23.7"
junit = "4.13.2"
androidxTestExt = "1.2.1"
espresso = "3.6.1"
turbine = "1.1.0"
coroutinesTest = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Optional icon packs (compose-icons by devsrsouza). Default: feather + tabler.
# Add others by uncommenting and adding to app/build.gradle.kts dependencies.
# R8 strips unused packs in release builds.
composeicons-feather = { group = "br.com.devsrsouza.compose.icons", name = "feather", version.ref = "composeIcons" }
composeicons-tabler = { group = "br.com.devsrsouza.compose.icons", name = "tabler-icons", version.ref = "composeIcons" }
# composeicons-simple = { group = "br.com.devsrsouza.compose.icons", name = "simple-icons", version.ref = "composeIcons" }
# composeicons-fontawesome = { group = "br.com.devsrsouza.compose.icons", name = "font-awesome", version.ref = "composeIcons" }
# composeicons-eva = { group = "br.com.devsrsouza.compose.icons", name = "eva-icons", version.ref = "composeIcons" }
# composeicons-octicons = { group = "br.com.devsrsouza.compose.icons", name = "octicons", version.ref = "composeIcons" }
# composeicons-lineawesome = { group = "br.com.devsrsouza.compose.icons", name = "line-awesome", version.ref = "composeIcons" }
# composeicons-linea = { group = "br.com.devsrsouza.compose.icons", name = "linea", version.ref = "composeIcons" }
# composeicons-weather = { group = "br.com.devsrsouza.compose.icons", name = "weather-icons", version.ref = "composeIcons" }
# composeicons-cssgg = { group = "br.com.devsrsouza.compose.icons", name = "css-gg", version.ref = "composeIcons" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# Supabase (KMP lib; uses ktor-client-okhttp engine so HTTP stack is shared with Retrofit/OkHttp.
# See CLAUDE.md decision: official Supabase Android quickstart uses supabase-kt — no Android-only alternative exists.
# Ktor 3.3.0 is required by supabase-kt 3.6.x; supabase BOM pins module versions only, not ktor.
#
# NOTE: compose-auth + compose-auth-ui INTENTIONALLY EXCLUDED. They drag Compose Multiplatform's
# material3 (org.jetbrains.compose.material3:1.9.x-beta) + androidx.activity 1.12.x which require
# AGP 8.9.1+ / compileSdk 36. Google sign-in is handled via Credential Manager + auth-kt's
# signInWith(IDToken) directly, no compose-auth needed.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
# postgrest-kt — needed for the optional Supabase-backed RemoteAppConfig
# (KitConfig.RemoteConfigProvider.SUPABASE reads an `app_config` table).
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

# Firebase Auth (optional alternative — user adds google-services.json + google-services plugin to activate).
# Default kit ships with AUTH_PROVIDER = STUB; flipping to FIREBASE without google-services.json will runtime-fail.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }

# Credential Manager (Google sign-in via Android 14+ Credential Manager API).
# Used as primary Google sign-in path; supabase-kt deeplink (OAuth web flow) is fallback.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# RevenueCat — in-app purchases / subscriptions. Native Android SDK (no KMP).
revenuecat-purchases = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }
# RevenueCat's prebuilt Paywall Composable (standard Jetpack Compose for Android — NOT Compose Multiplatform).
revenuecat-purchases-ui = { group = "com.revenuecat.purchases", name = "purchases-ui", version.ref = "revenuecat" }

# Analytics — PostHog (product analytics) + Firebase Analytics + Crashlytics.
# Firebase Analytics/Crashlytics need google-services.json + the google-services &
# firebase-crashlytics Gradle plugins to actually report; deps compile without them.
posthog-android = { group = "com.posthog", name = "posthog-android", version.ref = "posthog" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Ops — FCM push, Firebase Remote Config, Play In-App Review.
# Firebase pieces need google-services.json + plugin; play-review works without.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }

# Logging — Timber. Plant DebugTree in debug, CrashlyticsTree in release (gated on
# KitConfig.ANALYTICS_ENABLED + Firebase actually configured). Replaces raw android.util.Log
# across the kit; survives R8 obfuscation; lets devs add new Tree impls (Sentry, file, etc).
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# OSS licenses screen — pairs with the gms.oss-licenses-plugin below. Plugin reads the
# project's POMs at build time and bakes the result into raw resources; OssLicensesMenuActivity
# renders them. Settings → About → Open source licenses launches it.
play-services-oss-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "ossLicenses" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
