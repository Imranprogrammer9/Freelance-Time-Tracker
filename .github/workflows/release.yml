name: Release

# Builds a signed release AAB and (optionally) uploads it to the Play Store
# internal track. Triggers on a v* tag push, or manually.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64            base64 of your release keystore (.jks)
#   KEYSTORE_PASSWORD          keystore password
#   KEY_ALIAS                  key alias
#   KEY_PASSWORD               key password
#   SUPABASE_URL / SUPABASE_KEY            (optional) baked into BuildConfig
#   REVENUECAT_ANDROID_API_KEY             (optional)
#   POSTHOG_API_KEY / POSTHOG_HOST         (optional)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON       (optional) enables the Play upload step

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          cat <<EOF > local.properties
          supabase.url=${{ secrets.SUPABASE_URL }}
          supabase.key=${{ secrets.SUPABASE_KEY }}
          revenuecat.android.api.key=${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          posthog.api.key=${{ secrets.POSTHOG_API_KEY }}
          posthog.host=${{ secrets.POSTHOG_HOST }}
          EOF

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Optional — uploads to the Play internal track when the service-account
      # secret is present. Remove the `if:` to make it mandatory.
      - name: Upload to Play Store (internal track)
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.shipkaro.kit
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
